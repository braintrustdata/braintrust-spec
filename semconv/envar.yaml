description: Canonical environment variable spec for Braintrust SDKs

config_envars:
  - name: BRAINTRUST_API_KEY
    required: true
    env_braintrust: true
    documentation: >-
      API key for authentication with Braintrust. Missing, empty, or
      whitespace-only process environment values are treated as unset.
      Filesystem-capable SDKs then fall back to the nearest .env.braintrust
      file as specified in docs/features/environment-variables.md.

  - name: BRAINTRUST_APP_URL
    required: false
    env_braintrust: true
    default: "https://www.braintrust.dev"
    documentation: Base URL for Braintrust web application.

  - name: BRAINTRUST_API_URL
    required: false
    env_braintrust: true
    default: "https://api.braintrust.dev"
    documentation: Base URL for Braintrust API.

  - name: BRAINTRUST_PROJECT
    required: false
    env_braintrust: true
    documentation: Project name for Braintrust logging and tracing. The SDK will provide a default of its choosing if this is not set.

  - name: BRAINTRUST_PROJECT_ID
    required: false
    env_braintrust: true
    documentation: Project ID (UUID) for logging spans. Takes precedence over BRAINTRUST_PROJECT if both are set.

  - name: BRAINTRUST_ORG_NAME
    required: false
    env_braintrust: true
    documentation: Organization name to use when logging in. Useful when account has multiple organizations.

  - name: BRAINTRUST_ENVIRONMENT_TYPE
    required: false
    env_braintrust: true
    documentation: Optional explicit span origin environment type. When set, SDKs use this value for context.span_origin.environment.type instead of automatic environment detection.

  - name: BRAINTRUST_ENVIRONMENT_NAME
    required: false
    env_braintrust: true
    documentation: Optional explicit normalized span origin environment name. When set, SDKs use this value for context.span_origin.environment.name instead of automatic environment detection.

  - name: BRAINTRUST_ENABLE_GIT_METADATA
    required: false
    env_braintrust: false
    type: boolean
    default: "true"
    documentation: >-
      Enables or disables automatic Git metadata collection during experiment
      initialization. Read from the process environment only; it is
      intentionally not read from .env.braintrust. Missing, empty, or
      whitespace-only values are unset. Other values are trimmed and compared
      case-insensitively: "true" and "1" are enabled, "false" and "0" are
      disabled. Any other value is invalid, is treated as unset, and must not
      throw (SDKs should warn at most once). Unset or enabled preserves the
      organization/default behavior and never forces collection on or permits
      extra fields. Disabled, when the caller passes no explicit Git metadata
      collection option, skips repository metadata and ancestor discovery and
      starts zero Git subprocesses. Explicit caller collection options take
      precedence, and organization policy is always the ceiling. See
      skills/instrumentation-spec/references/features/experiment-git-metadata.md.
