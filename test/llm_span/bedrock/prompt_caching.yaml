expected_brainstore_spans:
  # Turn 1 — cache write. Bedrock reports inputTokens exclusive of cache tokens but
  # folds them into totalTokens, so prompt_tokens must be the rolled-up figure while
  # tokens stays the provider's own total. TokenAccountingSpec enforces the arithmetic
  # (tokens == prompt + completion, and cache tokens fitting inside prompt_tokens);
  # these assertions pin which bucket each count lands in.
  - metrics:
      tokens: !fn is_non_negative_number
      prompt_tokens: !fn is_non_negative_number
      completion_tokens: !fn is_non_negative_number
      # A cold cache MUST actually write, or the cachePoint never reached the provider.
      prompt_cache_creation_tokens: !fn is_positive_number
      prompt_cached_tokens: !fn is_non_negative_number
    metadata:
      model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock
    span_attributes:
      name: bedrock.converse
      type: llm
    context:
      span_origin:
        name: !fn is_non_empty_string
        version: !fn is_non_empty_string
        instrumentation:
          name: !fn is_non_empty_string
    output:
      - role: assistant
        content:
          - type: text
            text: !fn is_non_empty_string
  # Turn 2 — cache read. The request is byte-identical, so the prefix written above is
  # served from cache and the same arithmetic must hold with the tokens counted as a
  # read instead of a write.
  - metrics:
      tokens: !fn is_non_negative_number
      prompt_tokens: !fn is_non_negative_number
      completion_tokens: !fn is_non_negative_number
      prompt_cached_tokens: !fn is_positive_number
    metadata:
      model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      provider: bedrock
    span_attributes:
      name: bedrock.converse
      type: llm
    output:
      - role: assistant
        content:
          - type: text
            text: !fn is_non_empty_string
