name: streaming
type: llm_span_test
provider: google
endpoint: /v1/models/gemini-2.5-flash:generateContent
requests:
  - contents:
      - role: user
        parts:
          - text: Explain in two sentences why the sky appears blue.
    generationConfig:
      temperature: 0.0
      thinkingConfig:
        includeThoughts: true
    stream: true
expected_brainstore_spans:
  - metrics: !fn is_google_streaming_usage_metadata_normalized
    metadata:
      model: !starts_with gemini-2.5-flash
      provider: google
    span_attributes:
      type: llm
    context:
      span_origin:
        name: !fn is_non_empty_string
        version: !fn is_non_empty_string
        instrumentation:
          name: !fn is_non_empty_string
    output: !fn is_non_empty_mapping
