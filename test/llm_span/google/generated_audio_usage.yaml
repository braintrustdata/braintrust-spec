name: generated_audio_usage
type: llm_span_test
provider: google
endpoint: /v1/models/gemini-3.8-flash-tts:generateContent
requests:
  - contents:
      - role: user
        parts:
          - text: Hello and welcome to Braintrust.
    generationConfig:
      responseModalities: [AUDIO]
      speechConfig:
        voiceConfig:
          voice: Kore
expected_brainstore_spans:
  - metrics:
      tokens: !fn is_non_negative_number
      prompt_tokens: !fn is_non_negative_number
      completion_tokens: !fn is_non_negative_number
      completion_audio_tokens: !fn is_positive_number
    metadata:
      model: !starts_with gemini-3.8-flash-tts
      provider: google
    span_attributes:
      type: llm
    context:
      span_origin:
        name: !fn is_non_empty_string
        version: !fn is_non_empty_string
        instrumentation:
          name: !fn is_non_empty_string
    output:
      candidates:
        - content:
            role: model
