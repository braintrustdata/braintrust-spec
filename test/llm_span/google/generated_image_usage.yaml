name: generated_image_usage
type: llm_span_test
provider: google
endpoint: /v1/models/gemini-2.5-flash-image:generateContent
requests:
  - contents:
      - role: user
        parts:
          - text: Generate a simple blue square icon.
    generationConfig:
      responseModalities: [TEXT, IMAGE]
expected_brainstore_spans:
  - metrics:
      tokens: !fn is_non_negative_number
      prompt_tokens: !fn is_non_negative_number
      completion_tokens: !fn is_non_negative_number
      completion_image_tokens: !fn is_positive_number
    metadata:
      model: !starts_with gemini-2.5-flash-image
      provider: google
    span_attributes:
      type: llm
    context:
      span_origin:
        name: !fn is_non_empty_string
        version: !fn is_non_empty_string
        instrumentation:
          name: !fn is_non_empty_string
    output:
      candidates:
        - content:
            role: model
